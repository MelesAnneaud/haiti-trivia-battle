
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haiti Trivia Battle 🇭🇹</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 12px;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(125deg,#101b8e,#671678,#dc1244);
}
.panel {
  max-width: 540px;
  margin: 20px auto;
  padding: 28px 22px;
  background: #190522;
  border-radius: 24px;
  box-shadow: 0 12px 30px #0005;
}
h1 { font-size: clamp(27px,6vw,35px); }
h2 { font-size: 24px; }
p { line-height: 1.5; }
button {
  display: block;
  margin: 14px auto;
  padding: 15px 25px;
  width: 100%;
  background: #ffda00;
  color: #15051b;
  border: 0;
  border-radius: 11px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .5; cursor: not-allowed; }
input {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border: 0;
  border-radius: 10px;
}
.hidden { display: none !important; }
.room { font-size: 35px; color: #ffda00; font-weight: bold; }
.scores, .players { display: flex; gap: 10px; margin: 20px 0; }
.score, .player {
  flex: 1;
  min-width: 0;
  background: #ffffff20;
  padding: 15px 8px;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
.answer {
  background: white;
  color: #15051b;
  font-size: 16px;
}
.answer.selected { background: #ffda00; }
.status { color: #ffda00; font-weight: bold; }
.small { font-size: 13px; color: #ddd; }
.secondary { background: #fff3; color: white; }
</style>
</head>
<body>

<main class="panel">
  <h1>🇭🇹 Haiti Trivia Battle 🇭🇹</h1>
  <p>Learn • Compete • Represent Haiti</p>

  <section id="home">
    <h2>Enter Your Name</h2>
    <input id="name" placeholder="Player Name" maxlength="24">
    <button id="create">Create Game</button>
    <button id="join">Join Game</button>
    <p class="small">Play with a friend on another device.</p>
  </section>

  <section id="lobby" class="hidden">
    <h2>Your Game Room</h2>
    <div class="room" id="roomCode"></div>
    <p>Share this code with your friend.</p>
    <div class="players">
      <div class="player" id="p1">Player 1</div>
      <div class="player" id="p2">Waiting for Player 2</div>
    </div>
    <p class="status" id="lobbyStatus">Connecting...</p>
    <button id="start" class="hidden">Start Game</button>
    <button class="leave secondary">Leave Game</button>
  </section>

  <section id="game" class="hidden">
    <div class="scores">
      <div class="score">
        <b id="scoreName1"></b>
        <div id="score1">0</div>
      </div>
      <div class="score">
        <b id="scoreName2"></b>
        <div id="score2">0</div>
      </div>
    </div>
    <p id="progress"></p>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <p class="status" id="feedback"></p>
  </section>

  <section id="results" class="hidden">
    <h2>🏆 Game Over! 🏆</h2>
    <h2 id="winner"></h2>
    <div class="scores">
      <div class="score">
        <b id="finalName1"></b>
        <div id="final1"></div>
      </div>
      <div class="score">
        <b id="finalName2"></b>
        <div id="final2"></div>
      </div>
    </div>
    <p id="resultStatus" class="status"></p>
    <button id="again" class="hidden">Play Again</button>
    <button class="leave secondary">Leave Game</button>
  </section>

  <p id="error" class="status" role="alert"></p>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const questions = [
  {
    q: "What is the capital of Haiti?",
    a: ["Port-au-Prince", "Cap-Haïtien", "Jacmel", "Gonaïves"],
    c: 0
  },
  {
    q: "What year did Haiti declare independence?",
    a: ["1492", "1804", "1844", "1900"],
    c: 1
  },
  {
    q: "What languages are official in Haiti?",
    a: [
      "English and Spanish",
      "French only",
      "Haitian Creole and French",
      "Spanish and French"
    ],
    c: 2
  },
  {
    q: "What is Haiti's currency?",
    a: ["Dollar", "Gourde", "Peso", "Euro"],
    c: 1
  },
  {
    q: "Which island does Haiti share with the Dominican Republic?",
    a: ["Cuba", "Jamaica", "Hispaniola", "Puerto Rico"],
    c: 2
  },
  {
    q: "Who was a leader of the Haitian Revolution?",
    a: [
      "Toussaint Louverture",
      "George Washington",
      "Simón Bolívar",
      "Napoleon III"
    ],
    c: 0
  },
  {
    q: "What is the famous Haitian fortress called?",
    a: [
      "Fort Knox",
      "Citadelle Laferrière",
      "Fort Sumter",
      "El Morro"
    ],
    c: 1
  },
  {
    q: "Which sea borders Haiti to the south?",
    a: ["Red Sea", "Baltic Sea", "Caribbean Sea", "Black Sea"],
    c: 2
  },
  {
    q: "Which city is known for its historic northern port?",
    a: ["Cap-Haïtien", "Miami", "Kingston", "Santo Domingo"],
    c: 0
  },
  {
    q: "On what date is Haitian Independence Day?",
    a: ["July 4", "January 1", "May 18", "December 25"],
    c: 1
  }
];

let peer = null;
let conn = null;
let host = false;
let myName = "";
let otherName = "";
let room = "";
let index = 0;
let scores = [0, 0];
let answered = [false, false];
let selections = [null, null];
let phase = "home";
let round = 0;
let advancing = false;
let advanceTimer = null;
let connectionReady = false;

function show(id) {
  ["home", "lobby", "game", "results"].forEach(section => {
    $(section).classList.toggle("hidden", section !== id);
  });
  phase = id;
}

function error(message) {
  $("error").textContent = message;
}

function clearError() {
  error("");
}

function send(message) {
  if (conn && conn.open) {
    conn.send(message);
    return true;
  }
  return false;
}

function closeAll() {
  if (advanceTimer) {
    clearTimeout(advanceTimer);
    advanceTimer = null;
  }

  connectionReady = false;

  if (conn) {
    try { conn.close(); } catch (e) {}
    conn = null;
  }

  if (peer) {
    try { peer.destroy(); } catch (e) {}
    peer = null;
  }
}

function leave() {
  closeAll();
  host = false;
  room = "";
  otherName = "";
  index = 0;
  scores = [0, 0];
  clearError();
  show("home");
}

function makeCode() {
  return "HT" + Math.floor(1000 + Math.random() * 9000);
}

function updateLobby() {
  $("roomCode").textContent = room;

  $("p1").textContent =
    "1. " + (host ? myName : otherName || "Player 1");

  $("p2").textContent =
    "2. " + (host ? otherName || "Waiting for Player 2" : myName);

  const connected = !!(
    conn &&
    conn.open &&
    otherName &&
    connectionReady
  );

  $("start").classList.toggle("hidden", !host || !connected);

  $("lobbyStatus").textContent = connected
    ? host
      ? "Player 2 connected! Ready to start."
      : "Connected! Waiting for Player 1 to start."
    : "Waiting for connection...";
}

function bindConnection(connection) {
  conn = connection;

  connection.on("open", () => {
    if (conn !== connection) return;

    connectionReady = true;

    if (!host) {
      send({ type: "join", name: myName });
    }

    updateLobby();
  });

  connection.on("data", message => {
    if (conn !== connection) return;

    if (message && typeof message === "object") {
      receive(message);
    }
  });

  connection.on("close", () => {
    if (conn !== connection) return;

    connectionReady = false;

    error("Player disconnected. Create a new room.");
    $("start").classList.add("hidden");
    $("again").classList.add("hidden");
  });

  connection.on("error", () => {
    if (conn !== connection) return;

    connectionReady = false;
    error("Connection problem. Create a new room.");
  });
}

function create() {
  clearError();

  myName = $("name").value.trim();

  if (!myName) {
    return error("Please enter your name first.");
  }

  if (typeof Peer === "undefined") {
    return error("Multiplayer service did not load.");
  }

  closeAll();

  host = true;
  otherName = "";
  room = makeCode();

  show("lobby");
  updateLobby();

  peer = new Peer("haiti-trivia-" + room.toLowerCase());

  peer.on("open", () => {
    $("lobbyStatus").textContent = "Waiting for Player 2...";
  });

  peer.on("connection", connection => {
    if (conn && conn.open) {
      connection.on("open", () => connection.close());
      return;
    }

    bindConnection(connection);
  });

  peer.on("error", e => {
    error(
      e.type === "unavailable-id"
        ? "Room code already exists. Create another room."
        : "Connection failed. Try creating another room."
    );
  });
}

function join() {
  clearError();

  myName = $("name").value.trim();

  if (!myName) {
    return error("Please enter your name first.");
  }

  if (typeof Peer === "undefined") {
    return error("Multiplayer service did not load.");
  }

  const value = prompt("Enter the room code:");

  if (value === null) return;

  const code = value.trim().toUpperCase();

  if (!/^HT[0-9]{4}$/.test(code)) {
    return error("Enter a code such as HT1234.");
  }

  closeAll();

  host = false;
  otherName = "";
  room = code;

  show("lobby");
  updateLobby();

  peer = new Peer();

  peer.on("open", () => {
    const connection = peer.connect(
      "haiti-trivia-" + room.toLowerCase(),
      { reliable: true }
    );

    bindConnection(connection);
  });

  peer.on("error", () => {
    error("Unable to connect. Check the room code.");
  });
}

function receive(message) {
  switch (message.type) {
    case "join":
      if (!host || phase !== "lobby") return;

      otherName = String(message.name || "Player 2").slice(0, 24);

      send({
        type: "welcome",
        name: myName
      });

      updateLobby();
      break;

    case "welcome":
      if (host) return;

      otherName = String(message.name || "Player 1").slice(0, 24);
      updateLobby();
      break;

    case "start":
      if (host) return;

      begin(false, message.round);
      break;

    case "answer":
      if (!host || phase !== "game") return;
      if (message.round !== round || message.index !== index) return;

      acceptAnswer(1, message.choice);
      break;

    case "state":
      if (host || phase !== "game") return;
      if (message.round !== round || message.index !== index) return;

      scores = [...message.scores];

      renderScores();

      if (message.answered[0] && message.answered[1]) {
        $("feedback").textContent = "Both players answered!";
      } else if (message.answered[1]) {
        $("feedback").textContent = "Waiting for Player 1...";
      }
      break;

    case "next":
      if (host || phase !== "game") return;
      if (message.round !== round) return;

      index = message.index;
      answered = [false, false];
      selections = [null, null];

      renderQuestion();
      break;

    case "finish":
      if (host || phase !== "game") return;

      scores = [...message.scores];
      renderResults();
      break;

    case "restart":
      if (host) return;

      begin(false, message.round);
      break;
  }
}

function begin(isHost, incomingRound) {
  if (isHost && (!conn || !conn.open || !otherName)) {
    return error("Wait for Player 2 to connect.");
  }

  if (advanceTimer) {
    clearTimeout(advanceTimer);
    advanceTimer = null;
  }

  if (isHost) {
    round++;
  } else {
    round = incomingRound;
  }

  index = 0;
  scores = [0, 0];
  answered = [false, false];
  selections = [null, null];
  advancing = false;

  clearError();
  show("game");
  renderQuestion();

  if (isHost) {
    send({ type: "start", round });
  }
}

function renderScores() {
  $("scoreName1").textContent = host ? myName : otherName;
  $("scoreName2").textContent = host ? otherName : myName;

  $("score1").textContent = scores[0];
  $("score2").textContent = scores[1];
}

function renderQuestion() {
  renderScores();

  $("progress").textContent =
    "Question " + (index + 1) + " of " + questions.length;

  $("question").textContent = questions[index].q;

  $("answers").replaceChildren();
  $("feedback").textContent = "";

  questions[index].a.forEach((answer, i) => {
    const button = document.createElement("button");

    button.className = "answer";
    button.textContent = answer;
    button.onclick = () => choose(i);

    $("answers").appendChild(button);
  });
}

function choose(choice) {
  if (phase !== "game") return;

  const player = host ? 0 : 1;

  if (answered[player]) return;

  if (
    !Number.isInteger(choice) ||
    choice < 0 ||
    choice >= questions[index].a.length
  ) return;

  answered[player] = true;
  selections[player] = choice;

  document.querySelectorAll(".answer").forEach((button, i) => {
    button.disabled = true;

    if (i === choice) {
      button.classList.add("selected");
    }
  });

  if (host) {
    acceptAnswer(0, choice);
  } else {
    const sent = send({
      type: "answer",
      round,
      index,
      choice
    });

    $("feedback").textContent = sent
      ? "Answer sent. Waiting for Player 1..."
      : "Connection lost. Your answer was not sent.";
  }
}

function acceptAnswer(player, choice) {
  if (!host || phase !== "game") return;

  if (
    !Number.isInteger(choice) ||
    choice < 0 ||
    choice >= questions[index].a.length
  ) return;

  if (player === 1) {
    if (answered[1]) return;

    answered[1] = true;
    selections[1] = choice;
  } else {
    if (!answered[0]) return;
  }

  if (choice === questions[index].c) {
    scores[player]++;
  }

  renderScores();

  send({
    type: "state",
    round,
    index,
    scores: [...scores],
    answered: [...answered],
    selections: [...selections]
  });

  if (answered[0] && answered[1] && !advancing) {
    advancing = true;

    $("feedback").textContent = "Both players answered!";

    advanceTimer = setTimeout(() => {
      advanceTimer = null;

      if (phase !== "game") return;

      index++;
      advancing = false;

      if (index >= questions.length) {
        send({
          type: "finish",
          scores: [...scores]
        });

        renderResults();
      } else {
        answered = [false, false];
        selections = [null, null];

        send({
          type: "next",
          round,
          index
        });

        renderQuestion();
      }
    }, 1200);
  } else {
    $("feedback").textContent = "Waiting for the other player...";
  }
}

function renderResults() {
  show("results");

  const n1 = host ? myName : otherName;
  const n2 = host ? otherName : myName;

  $("finalName1").textContent = n1;
  $("finalName2").textContent = n2;

  $("final1").textContent = scores[0];
  $("final2").textContent = scores[1];

  $("winner").textContent =
    scores[0] === scores[1]
      ? "It's a tie!"
      : (scores[0] > scores[1] ? n1 : n2) + " wins!";

  $("again").classList.toggle("hidden", !host);

  $("resultStatus").textContent = host
    ? "Ready for another round?"
    : "Waiting for Player 1 to play again.";
}

$("create").onclick = create;
$("join").onclick = join;

$("start").onclick = () => {
  begin(true);
};

$("again").onclick = () => {
  if (!host || !conn || !conn.open) {
    return error(
      "Other player disconnected. Create a new room."
    );
  }

  round++;

  send({
    type: "restart",
    round
  });

  begin(false, round);
};

document.querySelectorAll(".leave").forEach(button => {
  button.onclick = leave;
});

window.addEventListener("beforeunload", closeAll);
</script>
</body>
</html>
